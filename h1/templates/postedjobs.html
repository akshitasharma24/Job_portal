{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Posted Jobs</title>
    <link rel="stylesheet" href="{% static 'css/postedjobs.css' %}">
</head>
<body>
    <div class="container">
        <h2>Your Posted Jobs</h2>

        {% if jobs %}
            {% for job in jobs %}
                <form method="POST" action="{% url 'UpdateJob' job.id %}" class="job-form">
                    {% csrf_token %}
                    <div class="job-card">
                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text" name="company_name" value="{{ job.company_name }}" required>
                        </div>
                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text" name="job_title" value="{{ job.job_title }}" required>
                        </div>
                        <div class="form-group">
                            <label>Industry Type</label>
                            <select name="industry_type" required>
                                <option value="" disabled>Select</option>
                                <option value="IT" {% if job.industry_type == 'IT' %}selected{% endif %}>IT</option>
                                <option value="Finance" {% if job.industry_type == 'Finance' %}selected{% endif %}>Finance</option>
                                <option value="Education" {% if job.industry_type == 'Education' %}selected{% endif %}>Education</option>
                                <option value="Healthcare" {% if job.industry_type == 'Healthcare' %}selected{% endif %}>Healthcare</option>
                                <option value="E-Commerce" {% if job.industry_type == 'E-Commerce' %}selected{% endif %}>E-Commerce</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Headquarters</label>
                            <input type="text" name="headquarters" value="{{ job.headquarters }}" required>
                        </div>
                        <div class="form-group">
                            <label>Established Year</label>
                            <input type="text" name="established_year" value="{{ job.established_year }}" required>
                        </div>
                        <div class="form-group">
                            <label>About Company</label>
                            <textarea name="about_company">{{ job.about_company }}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Contact Person</label>
                            <input type="text" name="contact_person" value="{{ job.contact_person }}" required>
                        </div>
                        <div class="form-group">
                            <label>Contact Email</label>
                            <input type="email" name="contact_email" value="{{ job.contact_email }}" required>
                        </div>
                        <div class="form-group">
                            <label>Contact Phone</label>
                            <input type="text" name="contact_phone" value="{{ job.contact_phone }}" required>
                        </div>
                        <div class="form-group">
                            <label>Company Address</label>
                            <input type="text" name="company_address" value="{{ job.company_address }}" required>
                        </div>
                        <div class="form-group">
                            <label>Job Location</label>
                            <input type="text" name="job_location" value="{{ job.job_location }}" required>
                        </div>
                        <div class="form-group">
                            <label>Employment Type</label>
                            <select name="employment_type" required>
                                <option value="" disabled>Select</option>
                                <option value="Full-Time" {% if job.employment_type == 'Full-Time' %}selected{% endif %}>Full-Time</option>
                                <option value="Part-Time" {% if job.employment_type == 'Part-Time' %}selected{% endif %}>Part-Time</option>
                                <option value="Internship" {% if job.employment_type == 'Internship' %}selected{% endif %}>Internship</option>
                                <option value="Contract" {% if job.employment_type == 'Contract' %}selected{% endif %}>Contract</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Salary Range</label>
                            <input type="text" name="salary_range" value="{{ job.salary_range }}" required>
                        </div>
                        <div class="form-group">
                            <label>Experience Required</label>
                            <input type="text" name="experience_required" value="{{ job.experience_required }}" required>
                        </div>
                        <div class="form-group">
                            <label>Skills Required</label>
                            <input type="text" name="skills_required" value="{{ job.skills_required }}" required>
                        </div>
                        <div class="form-group">
                            <label>Job Description</label>
                            <textarea name="job_description">{{ job.job_description }}</textarea>
                        </div>

                        <div class="button-group">
                            <button type="submit" class="update-btn">Update</button>
                            <a href="{% url 'DeleteJob' job.id %}" class="delete-btn" onclick="return confirm('Are you sure you want to delete this job?')">Delete</a>
                        </div>
                    </div>
                </form>
            {% endfor %}
        {% else %}
            <div class="no-jobs">No jobs posted yet.</div>
        {% endif %}

        <a href="{% url 'PostJob' %}" class="post-more-btn">+ Post More Jobs</a>
    </div>
</body>
</html>
