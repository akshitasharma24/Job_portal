<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Animated Login</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/complogin.css' %}">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>Company Login</h2>
            <form action="{% url 'Complogin' %}" method="POST">
                {% csrf_token %}
                 <div class="input-box">
                    <input type="text" name="username" required>
                    <label>Username</label>
                    <i class="icon fas fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" name="password" required>
                    <label>Password</label>
                    <i class="icon fas fa-lock"></i>
                </div>
                <div class="options">
                    
                    <a href="{% url 'CompPass' %}">Forgot Password?</a>
                </div>
                
                    <button type="submit">Login</button>
            
                <p>Don't have an account? <a href="{% url 'CompReg' %}">Register</a></p>
            </form>
        </div>
    </div>
</body>
</html>
